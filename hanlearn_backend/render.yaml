databases:
  - name: hanlearn_backenddb
    plan: free
    databaseName: hanlearn_backend
    user: hanlearn_backend

services:
  - type: web
    plan: free
    name: hanlearn_backend
    runtime: python
    rootDir: hanlearn_backend
    buildCommand: './build.sh'
    startCommand: './start.sh'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hanlearn_backenddb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://mandarin-vocabulary-miner.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://mandarin-vocabulary-miner.vercel.app
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://.*\\.vercel\\.app$
      - key: WEB_CONCURRENCY
        value: 4